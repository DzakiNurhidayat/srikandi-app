name: Build and Deploy to Azure VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Build with Gradle
        run: ./gradlew :server:shadowJar
      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ktor-app-jar
          path: server/build/libs/*-all.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download JAR from build job
        uses: actions/download-artifact@v4
        with:
          name: ktor-app-jar

      - name: Copy JAR to VM via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          source: "*-all.jar"
          target: "/home/${{ secrets.VM_USERNAME }}/server-all.jar"

      - name: Restart Ktor service on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            sudo systemctl restart ktorapp.service
            echo "Service restarted!"
            sudo systemctl status ktorapp.service
