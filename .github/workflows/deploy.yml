name: Build and Deploy Distribution to Azure VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Build distribution package
        run: ./gradlew :server:installDist # <-- Perintah build baru

      - name: Create tarball from distribution
        run: tar -czf server-dist.tar.gz -C server/build/install/server .

      - name: Upload distribution tarball as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ktor-app-dist
          path: server-dist.tar.gz # <-- Upload file .tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download distribution tarball
        uses: actions/download-artifact@v4
        with:
          name: ktor-app-dist

      - name: Copy tarball to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          source: "server-dist.tar.gz"
          target: "/home/${{ secrets.VM_USERNAME }}"

      - name: Deploy on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          script: |
            # Buat direktori aplikasi jika belum ada
            mkdir -p /home/azureuser/app
            # Ekstrak isi tarball ke direktori aplikasi, menimpa yang lama
            tar -xzf /home/azureuser/server-dist.tar.gz -C /home/azureuser/app
            # Restart service
            sudo systemctl restart ktorapp.service
            echo "Service restarted!"